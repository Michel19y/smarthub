  <rect x="92" y="48" width="16" height="4.5" rx="2.2" fill="#0FF120" opacity="0.9"/>
  <circle cx="100" cy="136" r="3" fill="#0FF120" opacity="0.9"/>

  <path d="M126,60 C96,60 70,80 100,99 C130,118 104,138 74,138"
        fill="none" stroke="url(#ribbonGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
